<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - Smart Parking</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .btn-danger {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .alert {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .alert-success {
            background: #e6f7e6;
            color: #008800;
        }

        .alert-error {
            background: #fff1f0;
            color: #ff4444;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-logo"><h2>Smart Parking</h2><p>智慧停车管理系统</p></div>
            <div class="sidebar-nav">
                <a class="nav-item" id="nav-dashboard" href="/dashboard.html"><span class="icon">&#9776;</span> 主面板</a>
                <a class="nav-item" id="nav-parking" href="/parking.html"><span class="icon">&#127359;</span> 停车场</a>
                <a class="nav-item" id="nav-checkin" href="/checkin.html"><span class="icon">&#9971;</span> 车辆入库</a>
                <a class="nav-item" id="nav-vehicles" href="/vehicles.html"><span class="icon">&#128663;</span> 车辆信息</a>
                <a class="nav-item" id="nav-admin" href="/admin.html"><span class="icon">&#128100;</span> 管理页面</a>
                <a class="nav-item" id="nav-reservation" href="/reservation.html"><span class="icon">&#128197;</span> 预约管理</a>
                <a class="nav-item" id="nav-recognize" href="/recognize.html"><span class="icon">&#128247;</span> 车牌识别</a>
                <a class="nav-item active" id="nav-profile" href="/profile.html"><span class="icon">&#128101;</span> 个人中心</a>
                <a class="nav-item" id="nav-chat" href="/chat.html"><span class="icon">&#128172;</span> 联系客服</a>
            </div>
            <div class="sidebar-footer">
                <div class="user-info"><div class="user-avatar">U</div><div><div class="user-name">用户</div><div class="user-role">普通用户</div></div></div>
                <button class="btn btn-default btn-sm btn-block" onclick="logout()">退出登录</button>
            </div>
        </div>
        <div class="main-content">
            <div class="page-header"><h1>个人中心</h1><p>查看和管理您的账户信息</p></div>
            <div id="alert-box"></div>

            <div class="row">
                <div class="col-2">
                    <div class="card">
                        <div class="card-title">个人信息</div>
                        <div class="form-group"><label>用户名</label><input type="text" id="prof-username" class="form-control" readonly></div>
                        <div class="form-group"><label>手机号</label><input type="text" id="prof-phone" class="form-control"></div>
                        <div class="form-group"><label>真实姓名</label><input type="text" id="prof-truename" class="form-control"></div>
                        <div class="form-group"><label>角色</label><input type="text" id="prof-role" class="form-control" readonly></div>
                        <button class="btn btn-primary btn-sm" onclick="updateProfile()">保存修改</button>
                    </div>
                    <div class="card">
                        <div class="card-title">修改密码</div>
                        <div class="form-group"><label>新密码</label><input type="password" id="prof-new-pass" class="form-control" placeholder="留空则不修改"></div>
                        <button class="btn btn-primary btn-sm" onclick="updateProfile()">更新密码</button>
                    </div>

                    <div class="card" style="border-color: #ff4444;">
                        <div class="card-title" style="color:#ff4444">注销账号</div>
                        <p style="color:#666; margin-bottom:12px;">⚠️ 注销后账户数据将无法恢复，请谨慎操作</p>
                        <button class="btn btn-danger btn-sm" onclick="showDeleteModal()">注销账号</button>
                    </div>
                </div>
                <div class="col-1">
                    <div class="card">
                        <div class="card-title">我的余额 <span id="prof-balance" style="color:#ff4d4f;font-weight:bold">¥0.00</span></div>
                        <div id="prof-transactions" style="max-height:250px;overflow-y:auto"></div>
                    </div>
                    <div class="card">
                        <div class="card-title">我的套餐</div>
                        <div id="prof-passes" class="package-container">
                            <p style="color:#999">加载中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 注销弹窗（固定在页面上，不会被覆盖） -->
    <div id="deleteModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:#fff; width:90%; max-width:400px; padding:24px; border-radius:8px;">
            <h3 style="color:#ff4444; margin-top:0;">确认注销账号？</h3>
            <p>此操作不可撤销，所有数据将被清空！</p>
            <div class="form-group">
                <label>请输入登录密码确认：</label>
                <input type="password" id="deletePwd" class="form-control" placeholder="请输入密码">
            </div>
            <div style="display:flex; gap:10px; margin-top:16px;">
                <button class="btn btn-default" onclick="closeDeleteModal()">取消</button>
                <button class="btn btn-danger" onclick="confirmDelete()">确认注销</button>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/profile.js"></script>
    <script>
        // 打开/关闭弹窗
        function showDeleteModal() {
            document.getElementById('deleteModal').style.display = 'flex';
            document.getElementById('deletePwd').value = '';
        }
        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
        }

        // 最终版：注销后释放用户名，可立即注册
        async function confirmDelete() {
            const password = document.getElementById('deletePwd').value.trim();
            if (!password) {
                showAlert('请输入密码', 'error');
                return;
            }

            try {
                // ============== 1. 先修改用户名，释放原用户名 ==============
                const newUsername = user.username + "_已注销_" + Date.now();
                const renameRes = await fetch('/api/user/rename', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: user.id,
                        new_username: newUsername
                    })
                });

                // ============== 2. 再执行账号注销 ==============
                const deleteRes = await fetch('/api/user/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: user.id,
                        password: password
                    })
                });

                const data = await deleteRes.json();
                if (data.code === 200) {
                    alert("注销成功！用户名已释放，可重新注册");
                    localStorage.clear();
                    sessionStorage.clear();
                    location.href = "/index.html"; // 跳回登录页
                } else {
                    alert(data.msg || "注销失败");
                }
            } catch (err) {
                alert("网络异常");
            }
            closeDeleteModal();
        }
    </script>
</body>
</html>
